version: "2"
run:
  # The GPU parity test is behind this tag and never runs, so the linter is the
  # only thing that reads it. Without the tag it was not read at all.
  build-tags:
    - gpu
linters:
  default: all
  disable:
    - depguard # breaking things: https://github.com/atc0005/go-ci/issues/1024
    - err113 # no need to wrap all errors, too much work
    - exhaustruct # pointless
    - exhaustruct_v5 # pointless
    - wsl # deprecated
    - noinlineerr # enormous fan of inline errors
    - gomodguard # deprecated
    - gochecknoglobals # globals are sometimes ok
    - mnd # magic numbers are sometimes ok, this linter is too noisy
  settings:
    goconst:
      min-occurrences: 5
    varnamelen:
      min-name-length: 2
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      - linters:
          - goconst
        path: (.+)_test\.go
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    golines:
      max-len: 120
