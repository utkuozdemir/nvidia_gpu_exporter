# Values used by chart-testing installs in CI. The CI cluster has no GPU, and
# the image tag is pinned to 1.11.0 (which defaults to exec and serves health
# metrics without a GPU) because the in-repo appVersion is a placeholder. When
# bumping this tag to a v2.x release, also add extraArgs: ["--collect.backend=demo"]
# so the pod stays up in kind without libnvidia-ml.so.1.
image:
  tag: "1.11.0"
# The pinned image above still runs as root, which the chart's default
# runAsNonRoot rejects; an explicit runAsUser satisfies the check either way.
# Drop this once the tag is bumped to a release with the non-root image.
securityContext:
  runAsUser: 65534
serviceMonitor:
  enabled: false
podMonitor:
  enabled: false
prometheusRule:
  enabled: false
grafanaDashboard:
  enabled: true
