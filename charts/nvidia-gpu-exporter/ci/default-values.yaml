# Values used by chart-testing installs in CI. The CI cluster has no GPU, so
# the exporter serves only its health metrics there, which is enough for the
# install and the connection test to pass. The image tag is pinned because the
# in-repo appVersion is a placeholder.
image:
  tag: "1.11.0"
# The pinned image above still runs as root, which the chart's default
# runAsNonRoot rejects; an explicit runAsUser satisfies the check either way.
# Drop this once the tag is bumped to a release with the non-root image.
securityContext:
  runAsUser: 65534
serviceMonitor:
  enabled: false
podMonitor:
  enabled: false
prometheusRule:
  enabled: false
grafanaDashboard:
  enabled: true
