---
name: build

# no paths-ignore on purpose: the build check is required, so a PR touching
# only ignored paths could never merge (the check would stay pending forever),
# and the asset linting in this workflow must run exactly when docs, scripts
# or install assets change
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    branches:
      - main
    # the default types miss the base-branch change of a retargeted PR (it
    # arrives as "edited"), so a stacked PR that lands on main after its
    # parent merges would never get a run. The job-level guard below skips
    # the title/description edits that also arrive as "edited".
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  # an "edited" event that did not change the base branch is skipped by the
  # job guard below, so it must not cancel the real run that is in progress,
  # or a title or description edit leaves the pull request with no build at all
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}

defaults:
  run:
    shell: bash --noprofile --norc -euox pipefail {0}

# run edited-events only when the edit changed the base branch
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # every linter, at the versions pinned in hack/dev.Dockerfile, in the same
      # containers a developer gets locally. Nothing is installed here, so CI
      # and a workstation cannot drift apart.
      - name: Lint
        run: task lint
      # the chart's default runAsNonRoot relies on the images carrying a
      # numeric non-root user. A refactor that drops the directive would pass
      # every other check and then break every pod at container start.
      - name: Check that the images keep their non-root user
        run: |
          grep -q '^USER 65534:65534$' Dockerfile
          grep -q '^USER 65534:65534$' Dockerfile.nvml
      - name: Run tests
        run: go test -v -race -coverpkg=./... -coverprofile ./coverage.out -covermode=atomic -timeout 20m ./...
      - name: Print coverage results
        run: go tool cover -func ./coverage.out
      - name: Send coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
      # qemu and buildx so the goreleaser snapshot below can build the
      # container images for all platforms
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # the goreleaser version is declared once, in hack/dev.Dockerfile, so the
      # version that validates the release config in lint is the version that
      # builds the release. Fail loudly rather than guessing if that
      # declaration ever stops being exactly one line.
      - name: Resolve goreleaser version
        id: goreleaser_version
        run: |
          set -euo pipefail
          found="$(grep -E '^ARG GORELEASER_VERSION=' hack/dev.Dockerfile || true)"
          count="$(printf '%s' "${found}" | grep -c . || true)"
          if [ "${count}" != "1" ]; then
            echo "expected exactly one ARG GORELEASER_VERSION in hack/dev.Dockerfile, found ${count}" >&2
            exit 1
          fi
          version="${found#ARG GORELEASER_VERSION=}"
          if ! printf '%s' "${version}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ARG GORELEASER_VERSION is not a pinned version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
      # a full snapshot release (unpublished) rather than a single-target
      # build, so the packaging inputs (systemd unit, nfpm scriptlets) and
      # the container images are validated in CI instead of failing for the
      # first time on a real release. base image digest bumps automerge via
      # Renovate, so this build is the only gate between a bad digest and a
      # failed release
      - name: Build and package with Goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ steps.goreleaser_version.outputs.version }}
          args: release --snapshot --clean --skip=publish,sign,sbom
        env:
          PRIVATE_ACCESS_TOKEN: placeholder
      - name: Check for dirty files
        run: git diff --exit-code

  chart:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      - name: Check that the chart dashboards match docs/grafana/
        run: |
          cmp docs/grafana/dashboard.json charts/nvidia-gpu-exporter/dashboards/nvidia-gpu-metrics.json
          cmp docs/grafana/dashboard-overview.json charts/nvidia-gpu-exporter/dashboards/nvidia-gpu-overview.json
      - name: Lint chart
        run: ct lint --config .ct.yaml --all
      - name: Validate alert rules
        run: hack/alerts/verify.sh
      - name: Check that the chart README is current
        run: |
          # renovate: depName=jnorwood/helm-docs datasource=docker
          docker run --rm -v "$(pwd):/helm-docs" -u "$(id -u)" jnorwood/helm-docs:v1.14.2
          git diff --exit-code charts/
      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - name: Install chart
        run: ct install --config .ct.yaml --all
