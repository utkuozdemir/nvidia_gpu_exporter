---
name: release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euox pipefail {0}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
      packages: write # push images to GHCR
      id-token: write # cosign keyless image signing (OIDC)
    outputs:
      docker_io_: ${{ steps.images.outputs.docker_io_ }}
      docker_io__nvml: ${{ steps.images.outputs.docker_io__nvml }}
      ghcr_io_: ${{ steps.images.outputs.ghcr_io_ }}
      ghcr_io__nvml: ${{ steps.images.outputs.ghcr_io__nvml }}
    steps:
      # the release tag must carry a signature GitHub verifies against the
      # pusher's registered keys (any type: SSH, GPG or S/MIME). Checked before
      # anything is built or published, so an unsigned tag fails fast
      - name: Check that the release tag is signed, verified and bound to this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          if [ "$(jq -r .object.type <<<"${ref}")" != "tag" ]; then
            echo "release tag ${GITHUB_REF_NAME} is a lightweight tag; releases need an annotated, signed tag" >&2
            exit 1
          fi
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r .object.sha <<<"${ref}")")"
          # the signed object must name this tag and point at the commit this
          # run builds, so a re-pointed ref cannot reuse another tag's signature
          if [ "$(jq -r .tag <<<"${tag}")" != "${GITHUB_REF_NAME}" ]; then
            echo "the signed tag object is named '$(jq -r .tag <<<"${tag}")', not ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [ "$(jq -r .object.type <<<"${tag}")" != "commit" ] || [ "$(jq -r .object.sha <<<"${tag}")" != "${GITHUB_SHA}" ]; then
            echo "the signed tag points at $(jq -r .object.sha <<<"${tag}"), this run builds ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [ "$(jq -r .verification.verified <<<"${tag}")" != "true" ]; then
            echo "release tag ${GITHUB_REF_NAME} has no verified signature: $(jq -r .verification.reason <<<"${tag}")" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} carries a verified signature and points at ${GITHUB_SHA}"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # to be able to generate the full changelog:
          # https://github.com/goreleaser/goreleaser-action/issues/56#issuecomment-568718162
          fetch-depth: 0
      - name: Check that the released commit is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "commit ${GITHUB_SHA} is not on main; releases are cut from main only" >&2
            exit 1
          fi
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: utkuozdemir
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: depName=sigstore/cosign datasource=github-releases
          cosign-release: v3.1.3
      - name: Import the signing key
        # no xtrace: this step handles the private key
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          # fail loudly if the secret is not the key the docs and chart advertise
          expected="$(awk '/signKey:/{f=1} f&&/fingerprint:/{print $2; exit}' charts/nvidia-gpu-exporter/Chart.yaml)"
          if [ "${fpr}" != "${expected}" ]; then
            echo "imported key ${fpr} does not match the documented fingerprint ${expected}" >&2
            exit 1
          fi
          echo "GPG_FINGERPRINT=${fpr}" >>"${GITHUB_ENV}"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      # the goreleaser version is declared once, in hack/dev.Dockerfile, so the
      # version that validates the release config in lint is the version that
      # builds the release. Fail loudly rather than guessing if that
      # declaration ever stops being exactly one line.
      - name: Resolve goreleaser version
        id: goreleaser_version
        run: |
          set -euo pipefail
          found="$(grep -E '^ARG GORELEASER_VERSION=' hack/dev.Dockerfile || true)"
          count="$(printf '%s' "${found}" | grep -c . || true)"
          if [ "${count}" != "1" ]; then
            echo "expected exactly one ARG GORELEASER_VERSION in hack/dev.Dockerfile, found ${count}" >&2
            exit 1
          fi
          version="${found#ARG GORELEASER_VERSION=}"
          if ! printf '%s' "${version}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ARG GORELEASER_VERSION is not a pinned version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ steps.goreleaser_version.outputs.version }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_ACCESS_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Sign the container images
        id: images
        run: |
          version="${GITHUB_REF_NAME#v}"
          for repo in \
            docker.io/utkuozdemir/nvidia_gpu_exporter \
            ghcr.io/utkuozdemir/nvidia_gpu_exporter; do
            # sign every published tag variant of this release
            for tag in "${version}" "${version}-nvml"; do
              # the tag was just pushed; retry the registry read to avoid a race
              digest=""
              for _ in 1 2 3 4 5; do
                if digest="$(docker buildx imagetools inspect "${repo}:${tag}" \
                  --format '{{ .Manifest.Digest }}')"; then
                  break
                fi
                sleep 5
              done
              if [ -z "${digest}" ]; then
                echo "could not resolve a digest for ${repo}:${tag}" >&2
                exit 1
              fi
              cosign sign --yes "${repo}@${digest}"
              # hand the digest to the attestation steps below
              key="$(printf '%s_%s' "${repo%%/*}" "${tag#"${version}"}" | tr -c 'a-zA-Z0-9_\n' '_')"
              echo "${key}=${digest}" >>"${GITHUB_OUTPUT}"
            done
          done
      # the checksums list feeds the attestation job, which must be able to
      # run again on its own if the attestation service has a bad moment
      - name: Upload the checksums for attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

  # build provenance for every archive and package and for the four image
  # digests: a signed statement tying each digest to this repository, commit,
  # workflow and run. A separate job, after publishing and signing, so that
  # a failure here never leaves a published release unsigned and can be
  # retried without redoing the release. The images' attestations are stored
  # in GitHub's attestation store, not pushed to the registries: that is what
  # `gh attestation verify` reads, and GHCR does not serve the referrers API.
  attest:
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download the checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: checksums.txt
      - name: Attest the Docker Hub image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/utkuozdemir/nvidia_gpu_exporter
          subject-digest: ${{ needs.release.outputs.docker_io_ }}
      - name: Attest the Docker Hub nvml image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/utkuozdemir/nvidia_gpu_exporter
          subject-digest: ${{ needs.release.outputs.docker_io__nvml }}
      - name: Attest the GHCR image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/utkuozdemir/nvidia_gpu_exporter
          subject-digest: ${{ needs.release.outputs.ghcr_io_ }}
      - name: Attest the GHCR nvml image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/utkuozdemir/nvidia_gpu_exporter
          subject-digest: ${{ needs.release.outputs.ghcr_io__nvml }}

  helm-chart:
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      contents: write
      packages: write
      id-token: write # cosign keyless chart signing (OIDC)
    outputs:
      digest: ${{ steps.chart.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute chart and app versions from the tag
        run: |
          app_version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<<"${app_version}"
          chart_version="$((major + 1)).${minor}.${patch}"
          echo "APP_VERSION=${app_version}" >>"${GITHUB_ENV}"
          echo "CHART_VERSION=${chart_version}" >>"${GITHUB_ENV}"
      # a pinned helm, not the runner image's: the packaged chart must not
      # change because the runner picked up a new helm
      - name: Install helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: depName=helm/helm datasource=github-releases
          version: v3.21.4
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: depName=sigstore/cosign datasource=github-releases
          cosign-release: v3.1.3
      - name: Log in to GHCR
        # before importing the key, so no third-party action runs while the
        # private key material is present on disk
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Import the signing key
        # no xtrace: this step handles the private key and passphrase
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          # fail loudly if the secret is not the key the docs and chart advertise
          expected="$(awk '/signKey:/{f=1} f&&/fingerprint:/{print $2; exit}' charts/nvidia-gpu-exporter/Chart.yaml)"
          if [ "${fpr}" != "${expected}" ]; then
            echo "imported key ${fpr} does not match the documented fingerprint ${expected}" >&2
            exit 1
          fi
          # helm reads the pre-2.1 keyring format, so export the key into one
          umask 077
          gpg --batch --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" \
            --export-secret-keys "${fpr}" > /tmp/secring.gpg
          gpg --armor --export "${fpr}" > /tmp/pubkey.asc
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Package and sign chart
        # no xtrace: this step handles the passphrase
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          umask 077
          trap 'rm -f /tmp/passphrase.txt' EXIT
          echo "${GPG_PASSPHRASE}" > /tmp/passphrase.txt
          # reproducible package: helm keeps the checkout's file mtimes in the
          # tgz, so set them to the commit time first, like every other artifact
          find charts/nvidia-gpu-exporter -exec touch -d "$(git log -1 --format=%cI)" {} +
          helm package charts/nvidia-gpu-exporter \
            --version "${CHART_VERSION}" \
            --app-version "${APP_VERSION}" \
            --destination /tmp/chart-dist \
            --sign \
            --key "nvidia_gpu_exporter release signing" \
            --keyring /tmp/secring.gpg \
            --passphrase-file /tmp/passphrase.txt
          cp charts/artifacthub-repo.yml /tmp/chart-dist/
          cp /tmp/pubkey.asc /tmp/chart-dist/
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      # the private key is not needed past this point; remove it before any
      # further action runs in this job
      - name: Remove the signing key material
        run: rm -rf ~/.gnupg /tmp/secring.gpg
      - name: Upload the packaged chart for attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart
          path: /tmp/chart-dist/*.tgz
          if-no-files-found: error
      - name: Push and sign the chart on GHCR
        id: chart
        # no xtrace: the registry login reads the token on stdin
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          printf '%s' "${GH_TOKEN}" | helm registry login ghcr.io \
            --username "${{ github.repository_owner }}" \
            --password-stdin
          push_output="$(helm push /tmp/chart-dist/*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1)"
          echo "${push_output}"
          # sign the immutable digest, not the mutable tag
          digest="$(echo "${push_output}" | awk '/[Dd]igest:/{print $2; exit}')"
          if [ -z "${digest}" ]; then
            echo "could not determine the pushed chart digest" >&2
            exit 1
          fi
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/charts/nvidia-gpu-exporter@${digest}"
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish chart to the Helm repository on gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin gh-pages >/dev/null; then
            git fetch origin gh-pages:gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rfq .
          fi
          cp /tmp/chart-dist/*.tgz .
          cp /tmp/chart-dist/*.tgz.prov .
          cp /tmp/chart-dist/artifacthub-repo.yml .
          cp /tmp/chart-dist/pubkey.asc .
          if [ -f index.yaml ]; then
            helm repo index . --url "https://utkuozdemir.github.io/nvidia_gpu_exporter" --merge index.yaml
          else
            helm repo index . --url "https://utkuozdemir.github.io/nvidia_gpu_exporter"
          fi
          git add ./*.tgz ./*.tgz.prov index.yaml artifacthub-repo.yml pubkey.asc
          git commit -m "publish chart ${CHART_VERSION} (app ${APP_VERSION})"
          git push origin gh-pages

  # build provenance for the chart, the OCI artifact by digest and the
  # packaged file. Separate job for the same reasons as the attest job above.
  attest-chart:
    runs-on: ubuntu-24.04
    needs: helm-chart
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download the packaged chart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart
      - name: Attest the OCI chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/utkuozdemir/charts/nvidia-gpu-exporter
          subject-digest: ${{ needs.helm-chart.outputs.digest }}
      - name: Attest the packaged chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.tgz"
