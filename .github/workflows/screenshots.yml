name: screenshots

# Regenerates the dashboard images the README shows and opens a pull request
# with them, so they can be refreshed from the GitHub UI without a checkout or
# a local stack. Nothing triggers it automatically. Every run photographs live
# demo data, with its own jitter and its own clock, so a scheduled one would
# commit another megabyte of images showing the same dashboards.
on:
  workflow_dispatch:
    inputs:
      open_pull_request:
        description: "Open a pull request with the regenerated images"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  screenshots:
    name: screenshots
    runs-on: ubuntu-24.04
    # a wedged renderer would otherwise hold a runner for the default six hours
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # the same command a maintainer runs. It brings the dev stack up itself,
      # waits for the demo backend to have enough history to draw, and writes
      # the images into docs/grafana.
      - name: Capture
        run: task screenshots

      - name: Upload the images
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dashboard-images
          path: docs/grafana/dashboard*.png
          if-no-files-found: error

      # what a first failure needs to be diagnosable at all: the capture waits on
      # several things and says only which one it gave up on
      - name: Stack logs
        if: failure()
        run: docker compose -f hack/compose/docker-compose.yaml --profile screenshot logs --tail 100

      # Needs "Allow GitHub Actions to create and approve pull requests" enabled
      # for the repository; without it this step fails after the branch is
      # already pushed and the images are already uploaded as an artifact.
      - name: Open a pull request
        if: inputs.open_pull_request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # staged first, and by name: an image that is not tracked yet is
          # invisible to `git diff` and to a pathspec commit, so the run would
          # report nothing to do while the README pointed at a file that was
          # never committed
          git add docs/grafana/dashboard.png docs/grafana/dashboard-overview.png

          if git diff --cached --quiet; then
            echo "the images did not change, nothing to open"
            exit 0
          fi

          # the attempt is part of the name because a re-run keeps the run id,
          # and every capture produces different pixels: a retry would otherwise
          # push a divergent commit onto the branch its first attempt created
          branch="dashboard-images-${{ github.run_id }}-${{ github.run_attempt }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -s -m "docs: refresh the dashboard images" -m \
            "Regenerated by the screenshots workflow against a throwaway dev stack. Run ${{ github.run_id }}."
          git push origin "${branch}"

          # based on whatever ref was dispatched rather than the default
          # branch: a run from a feature branch should propose its images back
          # to that branch instead of opening one carrying every commit on it
          gh pr create \
            --title "docs: refresh the dashboard images" \
            --body "Regenerated by the [screenshots workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Review the images in the diff, then merge or close." \
            --base "${{ github.ref_name }}" \
            --head "${branch}"
