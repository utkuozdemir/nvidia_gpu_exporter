---
version: 2
before:
  hooks:
    - go mod download

builds:
  # Default Linux build: cgo-enabled so the native NVML backend (go-nvml) is
  # compiled in and selected by default. Requires glibc 2.34+ at runtime.
  - id: nvidia_gpu_exporter
    main: ./cmd/nvidia_gpu_exporter
    binary: nvidia_gpu_exporter
    # reproducible: no build paths in the binary, and the commit time as the
    # file and build timestamp, so the same commit yields the same bytes
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/prometheus/common/version.Version={{.Version}}
      - -X github.com/prometheus/common/version.Revision={{.Commit}}
      - -X github.com/prometheus/common/version.Branch={{.Branch}}
      - -X github.com/prometheus/common/version.BuildUser=goreleaser
      - -X github.com/prometheus/common/version.BuildDate={{.CommitDate}}
    env:
      - CGO_ENABLED=1
      # the module of CMVP certificate #5247, pinned instead of `certified`
      # so that a Go bump cannot change the module the docs cite
      - GOFIPS140=v1.0.0
      - CC={{ if eq .Arch "arm64" }}aarch64-linux-gnu-gcc{{ else }}gcc{{ end }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  # Windows (native NVML via lazy nvml.dll, no cgo) and macOS (exec default).
  - id: nvidia_gpu_exporter-other
    main: ./cmd/nvidia_gpu_exporter
    binary: nvidia_gpu_exporter
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/prometheus/common/version.Version={{.Version}}
      - -X github.com/prometheus/common/version.Revision={{.Commit}}
      - -X github.com/prometheus/common/version.Branch={{.Branch}}
      - -X github.com/prometheus/common/version.BuildUser=goreleaser
      - -X github.com/prometheus/common/version.BuildDate={{.CommitDate}}
    env:
      - CGO_ENABLED=0
      - GOFIPS140=v1.0.0
    goos:
      - darwin
      - windows
    goarch:
      - amd64

  # Fully static Linux build (no cgo, exec backend default) for musl/Alpine
  # hosts, older glibc (< 2.34) systems, and minimal wrapper-command setups.
  - id: nvidia_gpu_exporter-static
    main: ./cmd/nvidia_gpu_exporter
    binary: nvidia_gpu_exporter
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/prometheus/common/version.Version={{.Version}}
      - -X github.com/prometheus/common/version.Revision={{.Commit}}
      - -X github.com/prometheus/common/version.Branch={{.Branch}}
      - -X github.com/prometheus/common/version.BuildUser=goreleaser
      - -X github.com/prometheus/common/version.BuildDate={{.CommitDate}}
    env:
      - CGO_ENABLED=0
      - GOFIPS140=v1.0.0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: nvidia_gpu_exporter-archive
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- with .Arm }}v{{ . }}{{ end }}
      {{- with .Mips }}_{{ . }}{{ end }}
      {{- if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}
    ids:
      - nvidia_gpu_exporter
      - nvidia_gpu_exporter-other
    format_overrides:
      - goos: windows
        formats:
          - zip
    # the archive entries would otherwise carry the builder's uid, gid and
    # user name (1001 "runner" on the release runner) and the checkout's file
    # mode, which follows the umask, so the archives reproduced only under
    # that same user. Fixed owner and mode for every entry, and the commit
    # time on the extra files: the binaries get their mode (0755) from
    # goreleaser and their time from mod_timestamp above
    builds_info:
      owner: root
      group: root
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"

  - id: nvidia_gpu_exporter-static-archive
    name_template: >-
      {{ .ProjectName }}-static_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    ids:
      - nvidia_gpu_exporter-static
    builds_info:
      owner: root
      group: root
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"

nfpms:
  - id: nvidia_gpu_exporter
    ids:
      - nvidia_gpu_exporter
    package_name: nvidia-gpu-exporter
    # reproducible packages: the commit time as the file and build timestamp,
    # like the archives, so the deb and rpm are byte-identical across builds
    mtime: "{{ .CommitDate }}"
    rpm:
      # the rpm header records the build host, which defaults to the builder's
      # hostname and would differ between the runner and anyone rebuilding
      buildhost: goreleaser
    bindir: /usr/bin
    vendor: Utku Ozdemir
    homepage: https://github.com/utkuozdemir/nvidia_gpu_exporter
    license: MIT
    maintainer: Utku Ozdemir <utkuozdemir@gmail.com>
    section: misc
    description: |-
      Nvidia GPU exporter for Prometheus.
      Collects GPU metrics natively via NVML (or via `nvidia-smi` with `--collect.backend=exec`).
    formats:
      - deb
      - rpm
    overrides:
      deb:
        dependencies:
          - libc6 (>= 2.34)
      rpm:
        dependencies:
          - glibc >= 2.34
    contents:
      - src: ./install/systemd/nvidia_gpu_exporter.service
        dst: /usr/lib/systemd/system/nvidia_gpu_exporter.service
        file_info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: ./LICENSE
        dst: /usr/share/doc/nvidia-gpu-exporter/copyright
        file_info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
    scripts:
      preinstall: install/scripts/pre-install.sh
      postinstall: install/scripts/post-install.sh
      preremove: install/scripts/pre-remove.sh
      postremove: install/scripts/post-remove.sh
    deb:
      lintian_overrides:
        - changelog-file-missing-in-native-package
        - no-manual-page
        # Probably won't be implemented: https://github.com/goreleaser/nfpm/issues/15#issuecomment-830816661
        - maintainer-script-calls-systemctl

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One keyless cosign signature over checksums.txt covers every binary, archive
# and package, since the file lists their sha256 sums. The bundle carries the
# signature and the short-lived certificate, which names the release workflow
# as the signer, so there is no key to store or rotate. Signing is skipped in
# the snapshot and rebuild jobs, which have no OIDC identity to sign with.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

git:
  ignore_tags: # skip prereleases when finding the previous tag for the changelog
    - "*-*"

changelog:
  sort: asc
  groups:
    - title: "New Features"
      regexp: '^feat(\(.+\))?!?: '
      order: 0
    - title: "Bug Fixes"
      regexp: '^fix(\(.+\))?!?: '
      order: 1
    - title: "Performance Improvements"
      regexp: '^perf(\(.+\))?!?: '
      order: 2
    - title: "Documentation"
      regexp: '^docs(\(.+\))?!?: '
      order: 3
    - title: "Refactors & Internal Changes"
      regexp: '^refactor(\(.+\))?!?: '
      order: 4
    - title: "Dependency Updates"
      regexp: '^chore\(deps\)!?: '
      order: 5
    - title: "Build, CI & Chores"
      regexp: '^(build|ci|cd|cicd|docker|test|chore)(\(.+\))?!?: '
      order: 6
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - Merge pull request
      - Merge branch
      - go mod tidy

dockers_v2:
  - id: nvidia_gpu_exporter
    images:
      - docker.io/utkuozdemir/nvidia_gpu_exporter
      - ghcr.io/utkuozdemir/nvidia_gpu_exporter
    ids:
      - nvidia_gpu_exporter
    tags:
      - "{{ .Version }}" # keep the existing no-"v" tag scheme (e.g. 2.0.0)
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # reproducible image: the commit time as the image and history timestamp
    # (buildkit reads it from this build argument), and the exporter rewrites
    # the layer timestamps to it, which the COPY of the binary otherwise
    # stamps with the build time. The exporter option only applies to the
    # pushed release image: a snapshot loads a multi-platform build into the
    # daemon, which cannot carry it, so snapshot images stay non-reproducible.
    # buildkit's own provenance and SBOM attestations carry wall-clock times
    # and change the published index digest on every build, so they are off.
    # The release workflow attaches GitHub's build provenance instead.
    sbom: false
    build_args:
      SOURCE_DATE_EPOCH: "{{ .CommitTimestamp }}"
    flags:
      - "{{ if not .IsSnapshot }}--output=type=image,rewrite-timestamp=true,push=true{{ end }}"
      - "{{ if not .IsSnapshot }}--provenance=false{{ end }}"
    labels: &oci_metadata
      org.opencontainers.image.title: nvidia_gpu_exporter
      org.opencontainers.image.description: Prometheus exporter for NVIDIA GPUs
      org.opencontainers.image.source: https://github.com/utkuozdemir/nvidia_gpu_exporter
      org.opencontainers.image.url: https://github.com/utkuozdemir/nvidia_gpu_exporter
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.created: "{{ .CommitDate }}"
    annotations: *oci_metadata

scoops:
  - ids:
      - nvidia_gpu_exporter-archive
    repository:
      owner: utkuozdemir
      name: scoop_nvidia_gpu_exporter
      token: "{{ .Env.PRIVATE_ACCESS_TOKEN }}"
    commit_author:
      name: Utku Ozdemir
      email: utkuozdemir@gmail.com
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: https://github.com/utkuozdemir/nvidia_gpu_exporter
    description: Prometheus exporter for NVIDIA GPUs
    license: MIT

winget:
  - name: nvidia_gpu_exporter
    publisher: utkuozdemir
    package_identifier: utkuozdemir.nvidia_gpu_exporter
    package_name: Nvidia GPU Exporter
    short_description: Prometheus exporter for NVIDIA GPUs
    description: >-
      Prometheus exporter for NVIDIA GPUs. Collects GPU metrics natively via NVML
      (or via nvidia-smi with --collect.backend=exec). Supports running as a native
      Windows service.
    license: MIT
    license_url: https://github.com/utkuozdemir/nvidia_gpu_exporter/blob/main/LICENSE
    homepage: https://github.com/utkuozdemir/nvidia_gpu_exporter
    publisher_url: https://github.com/utkuozdemir
    publisher_support_url: https://github.com/utkuozdemir/nvidia_gpu_exporter/issues
    # Built from the Windows zip archive (nested portable exe).
    ids:
      - nvidia_gpu_exporter-archive
    release_notes: "{{ .Changelog }}"
    tags:
      - prometheus
      - nvidia
      - gpu
      - exporter
      - monitoring
    repository:
      owner: utkuozdemir
      name: winget-pkgs
      branch: "nvidia_gpu_exporter-{{ .Version }}"
      token: "{{ .Env.PRIVATE_ACCESS_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
